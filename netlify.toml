# Publicacao do Mapa da Pobreza Energetica.
# A pagina e autocontida: um unico HTML, sem build e sem dependencia externa.
#
# O "base" aponta para site/ de proposito. E no diretorio base que o Netlify procura
# arquivos de dependencia; deixando-o na raiz, o requirements.txt da versao anterior
# do trabalho faz o Netlify instalar pandas antes de publicar um HTML que nao usa
# Python. Com base em site/, nao ha o que instalar. O publish e relativo ao base.

[build]
  base = "site"
  publish = "."
  command = ""

# A pagina e um arquivo unico que muda a cada correcao, e max-age=3600 fazia quem
# ja tinha visitado continuar vendo a versao anterior por ate uma hora, sem saber.
# Com must-revalidate o navegador pergunta ao servidor antes de reusar; quando nada
# mudou a resposta e um 304 vazio, entao a checagem custa quase nada mesmo com 6 MB.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
